services:
  postgres:
    image: postgres:16
    container_name: coldemailer-postgres
    environment:
      POSTGRES_DB: coldemailer
      POSTGRES_USER: coldemailer
      POSTGRES_PASSWORD: coldemailer
    ports:
      - "5432:5432"
    volumes:
      - coldemailer-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coldemailer -d coldemailer"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: coldemailer-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: coldemailer-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # OpenSearch 1.3 bundles JDK 11 — avoids JDK 21 SIGILL on Apple Silicon Docker
  opensearch:
    image: opensearchproject/opensearch:1.3.14
    container_name: coldemailer-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -XX:-TieredCompilation
    ports:
      - "9200:9200"
    volumes:
      - coldemailer-osdata:/usr/share/opensearch/data

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:1.3.14
    container_name: coldemailer-dashboards
    depends_on:
      - opensearch
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true

  logstash:
    build: ./logstash
    container_name: coldemailer-logstash
    depends_on:
      - kafka
      - opensearch
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"

volumes:
  coldemailer-pgdata:
  coldemailer-osdata:
