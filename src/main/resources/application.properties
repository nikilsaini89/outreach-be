spring.application.name=cold-emailer
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/coldemailer}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:coldemailer}
spring.datasource.password=${DB_PASSWORD:coldemailer}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging — app logs at INFO by default; override via LOG_LEVEL_APP (e.g. DEBUG for verbose tracing).
logging.level.io.github.nikilsaini=${LOG_LEVEL_APP:INFO}
# Render structured key-value attributes (addKeyValue) on the console via %kvp.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg %kvp%n

google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID}
google.oauth.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET}
google.oauth.redirect-uri=http://localhost:8080/oauth/google/callback
google.oauth.auth-uri=https://accounts.google.com/o/oauth2/v2/auth
google.oauth.token-uri=https://oauth2.googleapis.com/token
google.oauth.scopes=openid,email,profile,https://www.googleapis.com/auth/gmail.send

app.encryption.secret-key=${APP_ENCRYPTION_SECRET_KEY}

gemini.api-key=${GEMINI_API_KEY}
gemini.model=gemini-2.5-flash
